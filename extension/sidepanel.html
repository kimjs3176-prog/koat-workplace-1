<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>서무비서</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div class="bar">
  <button class="ctx" id="ctx" type="button" hidden></button>
  <span class="sp"></span>
  <button class="ic" id="diag" type="button" title="진단 센터 — 실제 ERP 시험 기록·화면 구조를 보고서로" aria-label="진단 센터">🩺</button>
  <button class="ic" id="tool" type="button" title="ERP 맞춤 — 이 ERP 화면의 구조를 분석해 칸을 연결합니다" aria-label="ERP 맞춤">🔧</button>
  <button class="ic" id="home" type="button" title="처음 화면" aria-label="처음 화면">⌂</button>
  <button class="ic" id="opt" type="button" title="확장 설정" aria-label="확장 설정">⚙</button>
</div>
<div class="setup" id="setup" hidden>
  <div class="setup-ic">🗂</div>
  <b>서무비서 주소를 먼저 설정하세요</b>
  <p>기관에서 운영하는 서무비서 주소(예: https://secretary.koat.or.kr)를 확장 설정에 넣으면 이 패널에서 바로 열립니다.</p>
  <button class="btn" id="setupBtn" type="button">확장 설정 열기</button>
</div>
<iframe id="app" title="서무비서" hidden allow="clipboard-write"></iframe>
<script src="config.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
