<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KOAT 서무비서</title>
<meta name="description" content="출장·물품·행사·복무·결재 — 상황을 말하면 절차·기한·서식·근거를 안내하는 서무비서">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  /* KRDS(대한민국 정부 디자인 시스템) 참조 팔레트 — Primary #256EF4 */
  --g:#256ef4;--gd:#1b5fd9;--gl:#eaf2fe;
  --bg:#fbfbfc;--sf:#ffffff;--bd:rgba(17,18,23,.09);--tx:#1c1d21;--mu:#646b76;--ht:#8b919b;
  --shadow:0 1px 2px rgba(17,18,23,.05);
  --shadow-md:0 4px 16px rgba(17,18,23,.10);
  --shadow-focus:0 0 0 3px rgba(37,110,244,.28);
  --font:'Pretendard Variable',Pretendard,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --err-fg:#991b1b;
}
body.dark{--bg:#0c0d0f;--sf:#161719;--bd:rgba(255,255,255,.09);--tx:#e6e7ea;--mu:#a0a6b0;--ht:#737985;--gl:rgba(37,110,244,.18);--gd:#8fb2fb;--err-fg:#fca5a5;
  --shadow:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 4px 16px rgba(0,0,0,.5);}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{font-family:var(--font);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;letter-spacing:-.006em;min-height:100vh;display:flex;flex-direction:column;}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important;} }
button,input,textarea,select{font-family:inherit;}
:focus-visible{outline:2px solid var(--g);outline-offset:2px;}

.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--sf);border-bottom:1px solid var(--bd);}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--tx);min-width:0;}
.brand-ic{width:34px;height:34px;border-radius:10px;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.brand-t{font-size:17px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;}
.brand-s{font-size:11.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tb-sp{flex:1;}
.tb-btn{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
.tb-btn:hover{border-color:var(--g);color:var(--g);}
.main{width:100%;max-width:1240px;margin:0 auto;padding:22px 24px 40px;flex:1;}
.foot{text-align:center;padding:20px 16px;color:var(--ht);font-size:12px;border-top:1px solid var(--bd);background:var(--sf);line-height:1.7;}
@media (max-width:640px){
  .topbar{padding:10px 16px;gap:8px;}
  .brand-s,.tb-btn .tb-tl{display:none;}
  .main{padding:14px 16px 32px;}
}

/* 로딩·스피너 */
.assist-loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:24px;color:var(--mu);font-size:13px;}
.spinner{width:14px;height:14px;border:2.5px solid var(--gl);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}

/* 규정·서식 원문 보기 패널 */
.viewer-dim{position:fixed;inset:0;background:rgba(10,12,16,.35);z-index:80;opacity:0;pointer-events:none;transition:opacity .15s;}
.viewer-dim.show{opacity:1;pointer-events:auto;}
.viewer{position:fixed;top:0;right:0;bottom:0;width:min(880px,100vw);background:var(--sf);z-index:90;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.18);transform:translateX(102%);transition:transform .2s ease;visibility:hidden;}
.viewer.open{transform:none;visibility:visible;}
.viewer-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--bd);}
.viewer-t{flex:1;min-width:0;font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.viewer-t small{font-weight:500;color:var(--mu);font-size:11.5px;margin-left:6px;}
.viewer-x{width:32px;height:32px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--mu);cursor:pointer;font-size:14px;}
.viewer-x:hover{color:var(--tx);border-color:var(--g);}
.viewer iframe{flex:1;border:0;width:100%;background:#fff;}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(10,12,16,.4);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto;}
.modal-bg.show{display:flex;}
.modal{width:100%;max-width:980px;background:var(--sf);border-radius:14px;box-shadow:var(--shadow-md);border:1px solid var(--bd);}
.modal-h{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--bd);}
.modal-t{flex:1;font-size:15px;font-weight:800;}
.modal-b{padding:16px 18px;}

/* 토스트 */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1c1d21;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:120;opacity:0;pointer-events:none;transition:.18s;max-width:calc(100vw - 32px);text-align:center;line-height:1.5;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
body.dark .toast{background:#e6e7ea;color:#111;}
</style>
<link rel="stylesheet" href="/assets/secretary.css">
<script src="/assets/secretary.js"></script>
</head>
<body>
<script>try{ const v=localStorage.getItem('darkMode'); if(v==='1'||(v==null&&matchMedia('(prefers-color-scheme: dark)').matches)) document.body.classList.add('dark'); }catch(e){}</script>

<header class="topbar">
  <a class="brand" href="/" aria-label="서무비서 처음으로">
    <span class="brand-ic" id="brandIc" aria-hidden="true">🗂</span>
    <span><span class="brand-t" id="brandT">KOAT 서무비서</span><br><span class="brand-s" id="brandS">출장·물품·행사·복무·결재 — 상황을 말하면 절차·기한·서식·근거 안내</span></span>
  </a>
  <span class="tb-sp"></span>
  <a class="tb-btn" href="/upload" title="개정·신규 내규 문서를 업로드합니다(관리자)">⬆<span class="tb-tl"> 내규 업로드</span></a>
  <button class="tb-btn" id="darkBtn" type="button" aria-label="다크 모드 전환">🌙</button>
</header>

<main class="main">
  <div class="sec-wrap" id="secWrap" aria-live="polite"><div class="assist-loading"><div class="spinner"></div><span>서무 절차 불러오는 중...</span></div></div>
</main>

<footer class="foot">
  <b style="color:var(--g)" id="footT">KOAT 서무비서</b> · <span id="footS">한국농업기술진흥원 서무 업무 지원</span><br>
  <span id="footN">근거 조문은 기관 현행 내규 원문을 기준으로 안내합니다. 최종 판단은 원문과 담당 부서 확인을 거쳐 주세요.</span>
</footer>

<!-- 규정·서식 원문 보기 -->
<div class="viewer-dim" id="viewerDim"></div>
<aside class="viewer" id="viewer" aria-label="규정 원문 보기">
  <div class="viewer-h">
    <span class="viewer-t" id="viewerTitle">규정 원문</span>
    <a class="tb-btn" id="viewerExt" href="#" target="_blank" rel="noopener" title="새 창으로 열기">↗<span class="tb-tl"> 새 창</span></a>
    <button class="viewer-x" id="viewerClose" type="button" aria-label="닫기">✕</button>
  </div>
  <iframe id="viewerFrame" title="규정 원문" src="about:blank"></iframe>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
document.addEventListener('DOMContentLoaded', ()=>{
  const btn=document.getElementById('darkBtn');
  const sync=()=>{ btn.textContent=document.body.classList.contains('dark')?'☀️':'🌙'; };
  sync();
  btn.addEventListener('click', ()=>{ const d=!document.body.classList.contains('dark'); document.body.classList.toggle('dark', d);
    try{ localStorage.setItem('darkMode', d?'1':'0'); }catch(e){} sync(); });
  // 진입 파라미터: ?q=상황(바로 안내) · ?reg=규정명(원문 열기) · ?view=list|history|forms|manage
  const p=new URLSearchParams(location.search);
  Secretary.start({q:(p.get('q')||'').trim(), reg:(p.get('reg')||'').trim(), view:(p.get('view')||'').trim()});
});
</script>
</body>
</html>
