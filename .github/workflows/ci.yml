name: 시험

# PR·main 푸시마다: 서버 API·기본 절차 데이터(근거 연결)·화면 도우미(강조·요약·날짜·체크 이어받기) 시험과 문법 점검
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 의존성
        run: pip install -r requirements.txt pytest jsonschema
      - name: 문법 점검(JS)
        run: for f in assets/secretary.js extension/*.js forms/*.mjs scripts/*.mjs; do node --check "$f"; done
      - name: 서버·절차 데이터 시험
        run: python -m pytest -q tests
      - name: 화면 도우미 시험
        run: node --test tests/js/*.test.mjs
